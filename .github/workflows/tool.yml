name: tool
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in tools/, e.g. collect_referees.py"
        required: true
      args:
        description: "Arguments"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/${{ github.event.inputs.script }} ${{ github.event.inputs.args }}
      - name: Save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/history probe 2>/dev/null || true
          git commit -q -m "tool: ${{ github.event.inputs.script }} ${{ github.event.inputs.args }}" || echo "no changes"
          git pull -q --rebase -X theirs origin main && git push -q
