name: pages-cancel
# Cancels a GitHub Pages deployment stuck "in progress" (it blocks every later deploy).
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Pages deployment id or commit sha to cancel"
        required: true
permissions:
  pages: write
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the stuck deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/deployments/${{ inputs.sha }}/cancel" && echo "cancelled ${{ inputs.sha }}"
