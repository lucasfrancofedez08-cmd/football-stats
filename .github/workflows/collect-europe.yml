name: collect-europe
on:
  workflow_dispatch:
    inputs:
      args:
        description: "Arguments, e.g. --probe or 2023 2024 2025"
        required: true
        default: "--probe"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/collect_europe.py ${{ github.event.inputs.args }}
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/history probe 2>/dev/null || true
          git commit -q -m "European history: ${{ github.event.inputs.args }}" || echo "no changes"
          git pull -q --rebase -X theirs origin main && git push -q
