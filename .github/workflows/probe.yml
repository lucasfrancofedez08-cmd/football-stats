name: probe-sources
on:
  push:
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch samples from each source (round 2)
        run: |
          rm -rf probe && mkdir -p probe
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          get() { code=$(curl -sSL --compressed -m 30 -A "$UA" -o "probe/$1" -w "%{http_code}" "$2" || echo fail); echo "$code $(stat -c%s probe/$1 2>/dev/null) $1 $2" >> probe/status.txt; }
          E=https://site.api.espn.com/apis/site/v2/sports/soccer
          get r1.json "$E/eng.1/scoreboard?dates=20261020-20261104"
          get r2.json "$E/eng.1/scoreboard?dates=20261101"
          get r3.json "$E/eng.1/scoreboard?dates=20261020-20261104&limit=100"
          get r4.json "$E/eng.1/scoreboard?dates=2026"
          get r5.json "$E/uefa.champions/scoreboard?dates=20260901-20261231&limit=100"
          get r6.json "$E/esp.1/scoreboard?dates=20261101"
          pick() { python3 -c "import json,sys;d=json.load(open('probe/$1'));ev=[e for e in d.get('events',[]) if e['status']['type']['completed']];print(ev[-1]['id'] if ev else '')" 2>/dev/null; }
          for pair in "eng.1 r2.json" "esp.1 r6.json" "uefa.champions r5.json"; do
            set -- $pair; id=$(pick $2); [ -n "$id" ] && get "sum_$1.json" "$E/$1/summary?event=$id"
          done
          get sched.json "$E/eng.1/teams/349/schedule"
          get sched_all.json "$E/all/teams/349/schedule"
          cat probe/status.txt
      - name: Commit samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probe
          git commit -m "Probe: source samples (round 2)" || echo "nothing to commit"
          git push
