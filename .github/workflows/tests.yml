name: tests
on:
  push:
    branches: [main]
    paths: ["model/**", "pipeline/**", "tests/**", "backtest/**", "site/*.*"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install pytest playwright
      # uses the Google Chrome already installed on GitHub's runners (no browser download)
      - run: python -m pytest -q
